name: main

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.py'
      - '!**/ft3/__init__.py'
  push:
    branches:
      - main

env:
  PY_VERSIONS: '["3.11", "3.12", "3.13", "3.14"]'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: install-npm-deps
        if: github.event_name == 'pull_request'
        run: npm i @actions/core@1 @actions/github@6
      - id: validate-commit-message
        uses: ./.github/actions/validate-commit-message
        if: github.event_name == 'pull_request'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  setup:
    needs: [validate]
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.setVariables.outputs.python-versions }}
    steps:
      - id: setVariables
        run: |
          echo "python-versions=${{ toJson(env.PY_VERSIONS) }}" >> $GITHUB_OUTPUT
  standardize:
    needs: [validate, setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ fromJson(env.PY_VERSIONS)[0] }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install deps
        run: |
          python -m pip install ".[develop]"
      - name: ruff lint
        run: |
          python -m ruff check . --config pyproject.toml
      - name: ruff format
        run: |
          python -m ruff format . --config pyproject.toml --check
  test:
    needs: [validate, setup, standardize]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: setup dependencies
        run: |
          python -m pip install ".[develop]"
      - name: mypy
        run: python -m mypy
      - name: pytest
        run: pytest --verbose
  release:
    needs: [validate, setup, standardize, test]
    if: github.repository == 'dan1hc/ft3'
    name: semantic release
    runs-on: ubuntu-latest
    concurrency: push
    environment:
      name: pypi
      url: https://pypi.org/p/ft3
    permissions:
      actions: write
      contents: write
      deployments: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: release only the tested commit
        run: |
          git reset --hard ${{ github.event.pull_request.head.sha || github.sha }}
      - name: semantic release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          changelog: ${{ github.event_name == 'push' }}
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          prerelease: ${{ github.event_name == 'pull_request' }}
      - name: publish pypi
        id: pypi-publish
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
      - name: publish github release
        id: github-release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v10.7.0
        with:
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
